[versions]
agp = "8.7.2"
kotlin = "2.0.21"
composeBom = "2024.10.01"
camerax = "1.4.0"
media3 = "1.4.1"
room = "2.6.1"
datastore = "1.1.1"
work = "2.9.1"
mlkitLabeling = "17.0.9"
mlkitFace = "16.1.7"
playUpdate = "2.1.0"
okhttp = "4.12.0"
exif = "1.3.7"
ksp = "2.0.21-1.0.27"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.8.7" }
