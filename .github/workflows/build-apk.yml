name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          MAJOR="$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR"
          if [ "$MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, found Java $MAJOR."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android project directory
        id: locate_project
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          elif [ -f "android/settings.gradle.kts" ] && [ -d "android/app" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not locate settings.gradle.kts and app/ at repository root or android/."
            exit 1
          fi

      - name: Create temporary debug keystore
        working-directory: ${{ steps.locate_project.outputs.dir }}
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool)"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: ./debug.keystore was not created."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate_project.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        working-directory: ${{ steps.locate_project.outputs.dir }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Debug APK at $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $APK_PATH"
              exit 1
              ;;
          esac
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate_project.outputs.apk_path }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          APK_SRC="${{ steps.locate_project.outputs.apk_path }}"
          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO="$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${STAGE_DIR}/${ASSET_NAME}"
          cp "$APK_SRC" "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          set -euo pipefail
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset missing or empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset must end with .apk"
              exit 1
              ;;
          esac
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES="$(printf '%s\n' \
            "Automatically generated debug APK built by GitHub Actions." \
            "" \
            "- Run Number: ${GITHUB_RUN_NUMBER}" \
            "- Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit: ${GITHUB_SHA}" \
            "- Purpose: Testing build only (not a Play Store production release)" \
            "- Signing: Signed only with a temporary debug keystore")"
          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          if [ "$OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$TAG" --json url -q .url)"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Debug APK Build & Release Published"
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Release Title:** $TITLE"
              echo "- **Download Page:** $RELEASE_URL"
              echo "- **APK Asset:** \`$ASSET_NAME\` (download directly from the **Assets** section on the Release page)"
              echo "- **Backup Artifact:** GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and artifact upload succeeded."
            echo "Backup Actions artifact available: app-debug-apk"
            {
              echo "### Warning: GitHub Release Publishing Failed"
              echo "- The debug APK build **succeeded** and the GitHub Actions artifact \`app-debug-apk\` remains available for download on this run."
              echo "- Release publishing failed; check repository workflow permissions or tag state before retrying."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
